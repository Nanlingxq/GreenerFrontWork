            body, html {
                margin: 0;
                padding: 0;
                height: 100%;
            }
            #map {
                width: 100%;
                height: 100%;
            }
            .control-panel {
                position: fixed;
                top: 20px;
                right: 20px;
                background: rgba(255, 255, 255, 0.95);
                padding: 15px;
                border-radius: 10px;
                box-shadow: 2px 2px 10px rgba(0,0,0,0.3);
                z-index: 1000;
                font-size: 16px;
                font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
                color: #333;
                line-height: 1.6;
            }
            .control-panel .panel-title {
                display: flex;
                align-items: center;
                font-weight: bold;
                font-size: 18px;
                margin-bottom: 12px;
            }
            .control-panel .panel-title svg {
                width: 20px;
                height: 20px;
                margin-right: 8px;
                fill: #4CAF50;
            }
            .control-panel label {
                display: flex;
                align-items: center;
                margin-top: 10px;
                font-weight: 500;
            }
            .control-panel label i {
                margin-right: 10px;
                font-size: 20px;
                color: #4CAF50;
            }
            .control-panel button {
                width: 100%;
                margin-top: 12px;
                padding: 10px;
                font-size: 15px;
                border-radius: 6px;
                background-color: #4CAF50;
                color: white;
                border: none;
                cursor: pointer;
                transition: 0.3s;
            }
            .control-panel button:hover {
                background-color: #45a049;
            }
        </style>

        <!-- 上传街景按钮 -->
        <div id="uploadButton" onclick="startUpload()">
            📷 上传街景地图
        </div>
    
        <!-- 图片展示区域 -->
        <div id="streetViewContainer">
            <img id="streetViewImage" src="" alt="街景图像">
        </div>
    
        <!-- 上传文件夹选择 -->
        <input type="file" id="streetViewUpload" accept="image/*" webkitdirectory onchange="displayStreetView(event)">
    
        <!-- 图片展示容器 -->
        <div id="streetViewImages"></div>
    
        <script>
            // 函数：启动定位和文件上传流程
            function startUpload() {
                // 使用 geolocation API 获取用户当前位置
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(function(position) {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        alert(`当前位置：纬度 ${lat}, 经度 ${lng}。定位成功，您可以上传街景地图！`);
                        // 定位成功后，弹出文件上传框
                        document.getElementById('streetViewUpload').click();
                    }, function(error) {
                        alert("定位失败，请检查浏览器权限设置。");
                    });
                } else {
                    alert("您的浏览器不支持地理定位。");
                }
            }
    
            // 函数：显示上传的街景图
            function displayStreetView(event) {
                const files = event.target.files;
                if (files.length === 0) return;
    
                // 清空之前的图片显示
                const imgContainer = document.getElementById('streetViewImages');
                imgContainer.innerHTML = '';
    
                // 遍历选择的文件
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
    
                    // 确保文件是图片类型
                    if (file.type.startsWith('image/')) {
                        const reader = new FileReader();
                        reader.onload = function (e) {
                            const img = document.createElement('img');
                            img.src = e.target.result;
                            img.style.width = '100px'; // 限制显示图片的宽度
                            img.style.height = '100px'; // 限制显示图片的高度
                            imgContainer.appendChild(img); // 添加图片到容器中
                        };
                        reader.readAsDataURL(file);
                    }
                }
            }
        </script>


        <!-- 引入 Leaflet JS -->
        <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
        <script>
            function updateLayers() {
                const selected = [];
                if (document.getElementById('metro').checked) selected.push('地铁站');
                if (document.getElementById('bus').checked) selected.push('公交站');
                if (document.getElementById('bike').checked) selected.push('自行车点');
                if (document.getElementById('charge').checked) selected.push('充电站');
                alert("你选择了显示：" + selected.join('、'));
                // 此处可调用地图相关逻辑
            }
        </script>

        shanghaiChargeStations.forEach(function(station) {
            var marker = L.marker([station.lat, station.lon],{icon:chargingStationIcon})

            marker.addTo(layers.charge);
        });
    }

    addChargeStations();
    
    // 根据勾选状态更新图层显示
        function updateLayers() {
            for (var key in layers) {
                if (document.getElementById(key).checked) {
                    map.addLayer(layers[key]);
                } else {
                    map.removeLayer(layers[key]);
                }
            }
        }

        // 初始化图层
        updateLayers();
    </script>
